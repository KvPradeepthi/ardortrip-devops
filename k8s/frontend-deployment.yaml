apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: ardortrip-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ardortrip-frontend
  template:
    metadata:
      labels:
        app: ardortrip-frontend
    spec:
      containers:
        - name: frontend
          image: ardortrip-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: NodePort
  selector:
    app: ardortrip-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      name: http
